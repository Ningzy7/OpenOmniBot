name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  JAVA_VERSION: '17'
  FLUTTER_VERSION: '3.38.7'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get

      - name: Build release APK
        run: |
          ./gradlew --no-daemon --parallel --build-cache \
            :app:assembleDevelopStandardRelease \
            -Ptarget=lib/main_standard.dart

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: omnibot-release-apk
          path: app/build/outputs/apk/developStandard/release/*.apk
          if-no-files-found: warn
          retention-days: 7
